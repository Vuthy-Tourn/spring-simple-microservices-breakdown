spring:
    cloud:
        gateway:
          server:
              webflux:
                routes:
                  - id: product-service
                    uri: ${UPSTREAM_BASE_URL:http://localhost:8383}
                    predicates:
                      - Path=/api/v1/products/**
                    filters:
                      - StripPrefix=0
                  - id: user-service
                    uri: ${USER_SERVICE_URL:http://localhost:8181}
                    predicates:
                      #- Path=/api/v1/users/**
                      # because I want to override the path
                      - Path=/users/**
                    filters:
                      #- StripPrefix=0
                      - RewritePath=/users/(?<segment>.*), /api/v1/users/$\{segment}
    application:
      name: api-gateway
server:
  port: 8282
